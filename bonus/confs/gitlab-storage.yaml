# GitLab 설정 파일을 저장할 공간
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitlab-config
  namespace: gitlab
spec:
  # 하나의 노드에서 읽기/쓰기 방식으로 마운트
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---
# GitLab 로그를 저장할 공간
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitlab-logs
  namespace: gitlab
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi

---
# Git 저장소와 데이터베이스 등 주요 데이터를 저장할 공간
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitlab-data
  namespace: gitlab
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi