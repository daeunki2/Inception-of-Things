
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitlab
  namespace: gitlab

spec:
  # GitLab 서버는 하나만 실행합니다.
  replicas: 1

  # PVC를 사용하므로 업데이트 시 기존 Pod를 종료한 뒤 새 Pod를 실행합니다.
  strategy:
    type: Recreate

  # Deployment가 관리할 Pod의 라벨
  selector:
    matchLabels:
      app: gitlab

  template:
    metadata:
      labels:
        app: gitlab

    spec:
      containers:
        - name: gitlab

          # GitLab Community Edition 버전을 고정합니다.
          image: gitlab/gitlab-ce:19.5.1-ce.0
          imagePullPolicy: IfNotPresent

          # GitLab 내부 설정
          env:
            - name: GITLAB_OMNIBUS_CONFIG
              value: |
                external_url 'http://192.168.56.110:8080'
                nginx['listen_port'] = 80
                nginx['listen_https'] = false
                letsencrypt['enable'] = false

                # 메모리 사용량을 줄이기 위한 설정
                prometheus_monitoring['enable'] = false
                puma['worker_processes'] = 0
                sidekiq['concurrency'] = 5

          # GitLab 컨테이너가 사용하는 HTTP 포트
          ports:
            - name: http
              containerPort: 80

          # GitLab 데이터를 영구 저장하기 위한 PVC 연결
          volumeMounts:
            - name: gitlab-config
              mountPath: /etc/gitlab

            - name: gitlab-logs
              mountPath: /var/log/gitlab

            - name: gitlab-data
              mountPath: /var/opt/gitlab

          # 컨테이너 시작 상태 확인
          startupProbe:
            tcpSocket:
              port: 80
            periodSeconds: 10
            failureThreshold: 120

          # GitLab 웹 서버 준비 상태 확인
          readinessProbe:
            httpGet:
              path: /users/sign_in
              port: 80
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6

      # PVC를 Pod의 Volume으로 연결
      volumes:
        - name: gitlab-config
          persistentVolumeClaim:
            claimName: gitlab-config

        - name: gitlab-logs
          persistentVolumeClaim:
            claimName: gitlab-logs

        - name: gitlab-data
          persistentVolumeClaim:
            claimName: gitlab-data



